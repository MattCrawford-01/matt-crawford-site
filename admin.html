<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery Admin — Matt Crawford</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0a0a0a; --ink-2:#141414; --paper:#f4f3ef; --grey:#8c8c86;
    --line:rgba(244,243,239,0.14); --line-strong:rgba(244,243,239,0.28);
    --display:'Inter',sans-serif; --body:'Inter',sans-serif; --mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--ink); color:var(--paper); font-family:var(--body); line-height:1.6;}
  .wrap{max-width:640px; margin:0 auto; padding:80px 24px;}
  h1{font-family:var(--display); font-weight:800; text-transform:uppercase; font-size:28px; margin-bottom:8px;}
  .tag{font-family:var(--mono); font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--grey);}
  .field{margin:20px 0;}
  label{display:block; font-family:var(--mono); font-size:10.5px; letter-spacing:0.1em; text-transform:uppercase; color:var(--grey); margin-bottom:8px;}
  input, textarea, select{width:100%; background:transparent; border:1px solid var(--line-strong); color:var(--paper); font-family:var(--body); font-size:14px; padding:12px;}
  select option{background:var(--ink-2);}
  .btn{font-family:var(--mono); font-size:12px; letter-spacing:0.1em; text-transform:uppercase; background:var(--paper); color:var(--ink); border:none; padding:14px 24px; cursor:pointer; margin-top:10px;}
  .btn:hover{opacity:0.85;}
  .btn:disabled{opacity:0.4; cursor:not-allowed;}
  #loginScreen, #adminScreen{display:none;}
  #adminScreen.active, #loginScreen.active{display:block;}
  .result{margin-top:24px; padding:20px; border:1px solid var(--line-strong); font-family:var(--mono); font-size:12px; word-break:break-all;}
  .status{font-family:var(--mono); font-size:12px; color:var(--grey); margin-top:12px;}
  .thumbrow{display:flex; gap:8px; flex-wrap:wrap; margin-top:16px;}
  .thumbrow img{width:70px; height:70px; object-fit:cover;}

  .upload-progress{display:none; margin-top:16px;}
  .upload-progress-track{width:100%; height:6px; background:var(--ink-2); border:1px solid var(--line-strong); overflow:hidden; position:relative;}
  .upload-progress-fill{height:100%; background:var(--paper); width:0%; transition:width 0.25s ease;}
  .upload-progress-fill.indeterminate{width:30%; animation:upload-indeterminate 1.2s infinite ease-in-out;}
  @keyframes upload-indeterminate{
    0%{transform:translateX(-100%);}
    100%{transform:translateX(400%);}
  }
  .upload-progress-text{font-family:var(--mono); font-size:11px; color:var(--grey); margin-top:8px; display:flex; justify-content:space-between; gap:12px;}

  .gallery-list, .order-list{margin-top:16px;}
  .gallery-item, .order-item{border:1px solid var(--line-strong); padding:16px; margin-bottom:10px;}
  .gallery-item-name, .order-item-name{font-size:14px; font-weight:600;}
  .gallery-item-meta, .order-item-meta{font-family:var(--mono); font-size:10.5px; color:var(--grey); margin-top:4px;}
  .gallery-item-link{font-family:var(--mono); font-size:10.5px; color:var(--grey); margin-top:8px; word-break:break-all;}
  .btn-small{font-family:var(--mono); font-size:10.5px; letter-spacing:0.08em; text-transform:uppercase; background:none; border:1px solid var(--line-strong); color:var(--paper); padding:8px 14px; cursor:pointer; margin-top:12px;}
  .btn-small:hover{background:var(--paper); color:var(--ink);}
  .btn-small.btn-danger{border-color:rgba(200,90,90,0.5); color:#d98c8c; margin-left:8px;}
  .btn-small.btn-danger:hover{background:#c85a5a; color:var(--paper); border-color:#c85a5a;}
  .duplicate-form{display:none; margin-top:14px; padding-top:14px; border-top:1px solid var(--line);}
  .duplicate-form.active{display:block;}
  .duplicate-form input{margin-bottom:10px;}

  .order-item-lines{font-family:var(--body); font-size:13px; color:var(--paper); margin-top:10px; line-height:1.7;}
  .order-item-ship{font-family:var(--mono); font-size:11px; color:var(--grey); margin-top:10px; line-height:1.6;}
  .fulfilled-badge{display:inline-block; font-family:var(--mono); font-size:10px; letter-spacing:0.08em; text-transform:uppercase; color:#7ac47a; margin-top:12px;}

  .deliv-thumb{position:relative; width:70px; height:70px; cursor:pointer; border:2px solid transparent;}
  .deliv-thumb img{width:100%; height:100%; object-fit:cover; display:block;}
  .deliv-thumb.selected{border-color:var(--paper);}
  .deliv-thumb .check{position:absolute; top:3px; right:3px; width:16px; height:16px; border-radius:50%; border:1px solid var(--paper); background:rgba(10,10,10,0.55); font-size:9px; display:flex; align-items:center; justify-content:center;}
  .deliv-thumb.selected .check{background:var(--paper); color:var(--ink);}
</style>
</head>
<body>
<div class="wrap">

  <div id="loginScreen" class="active">
    <p class="tag">Admin</p>
    <h1>Gallery Dashboard</h1>
    <div class="field">
      <label>Admin Password</label>
      <input type="password" id="passwordInput">
    </div>
    <button class="btn" onclick="login()">[ Enter ]</button>
    <p class="status" id="loginStatus"></p>
  </div>

  <div id="adminScreen">
    <p class="tag">Admin</p>

    <h1 style="margin-top:0;">Create a New Gallery</h1>

    <div class="field">
      <label>Client Name</label>
      <input type="text" id="clientName">
    </div>
    <div class="field">
      <label>Business Name (optional)</label>
      <input type="text" id="clientBusiness">
    </div>
    <div class="field">
      <label>Client Email</label>
      <input type="email" id="clientEmail">
    </div>
    <div class="field">
      <label>Checkout Currency</label>
      <select id="clientCurrency">
        <option value="cad" selected>CAD — Canadian Dollars</option>
        <option value="usd">USD — US Dollars</option>
      </select>
    </div>
    <button class="btn" onclick="createGallery()">[ Create Gallery ]</button>
    <p class="status" id="createStatus"></p>

    <div id="uploadSection" style="display:none; margin-top:50px;">
      <p class="tag">Upload Photos &amp; Videos</p>
      <div class="field">
        <input type="file" id="photoFiles" multiple accept="image/*,video/mp4,video/quicktime">
      </div>
      <button class="btn" onclick="uploadPhotos()">[ Upload Selected Files ]</button>
      <p class="status" id="uploadStatus"></p>
      <div class="upload-progress" id="uploadProgress">
        <div class="upload-progress-track">
          <div class="upload-progress-fill" id="uploadProgressFill"></div>
        </div>
        <div class="upload-progress-text">
          <span id="uploadProgressLabel">0%</span>
          <span id="uploadProgressEta">Estimating time remaining...</span>
        </div>
      </div>
      <div class="thumbrow" id="thumbPreview"></div>
    </div>

    <div class="result" id="linkResult" style="display:none;"></div>

    <div style="margin-top:60px;">
      <p class="tag">Your Galleries</p>
      <p class="status" id="galleriesStatus" style="margin-top:8px;">Loading...</p>
      <div class="gallery-list" id="galleriesList"></div>
      <button class="btn-small" id="showMoreGalleriesBtn" onclick="showMoreGalleries()" style="display:none;">[ Show More ]</button>
    </div>

    <div style="margin-top:60px;">
      <p class="tag">Your Orders</p>
      <p class="status" id="ordersStatus" style="margin-top:8px;">Loading...</p>
      <div class="order-list" id="ordersList"></div>
      <button class="btn-small" id="showMoreOrdersBtn" onclick="showMoreOrders()" style="display:none;">[ Show More ]</button>
    </div>
  </div>

</div>

<script>
  let adminPassword = '';
  let currentGalleryId = null;

  function login() {
    adminPassword = document.getElementById('passwordInput').value;
    document.getElementById('loginScreen').classList.remove('active');
    document.getElementById('adminScreen').classList.add('active');
    loadGalleries();
    loadOrders();
  }

  async function createGallery() {
    const statusEl = document.getElementById('createStatus');
    const clientName = document.getElementById('clientName').value;
    const clientBusiness = document.getElementById('clientBusiness').value;
    const clientEmail = document.getElementById('clientEmail').value;
    const currency = document.getElementById('clientCurrency').value;

    if (!clientName || !clientEmail) {
      statusEl.textContent = 'Client name and email are required.';
      return;
    }

    statusEl.textContent = 'Creating...';

    const res = await fetch('/api/admin-create-gallery', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-admin-password': adminPassword },
      body: JSON.stringify({ clientName, clientBusiness, clientEmail, currency }),
    });

    if (res.status === 401) {
      statusEl.textContent = 'Wrong admin password.';
      return;
    }

    const data = await res.json();
    currentGalleryId = data.galleryId;
    statusEl.textContent = 'Gallery created — now upload photos below.';
    document.getElementById('uploadSection').style.display = 'block';

    const linkEl = document.getElementById('linkResult');
    linkEl.style.display = 'block';
    linkEl.textContent = data.galleryUrl;

    loadGalleries();
  }

  // ---------- Galleries list ----------

  let allGalleries = [];
  let galleriesExpanded = false;

  async function loadGalleries() {
    const statusEl = document.getElementById('galleriesStatus');

    const res = await fetch('/api/admin-list-galleries', {
      headers: { 'x-admin-password': adminPassword },
    });

    if (res.status === 401) {
      statusEl.textContent = 'Wrong admin password.';
      return;
    }

    const data = await res.json();
    allGalleries = data.galleries;
    galleriesExpanded = false;
    renderGalleriesList();
  }

  function renderGalleriesList() {
    const statusEl = document.getElementById('galleriesStatus');
    const listEl = document.getElementById('galleriesList');
    const showMoreBtn = document.getElementById('showMoreGalleriesBtn');

    if (allGalleries.length === 0) {
      statusEl.textContent = 'No galleries yet — create your first one above.';
      listEl.innerHTML = '';
      showMoreBtn.style.display = 'none';
      return;
    }

    statusEl.textContent = '';
    const visible = galleriesExpanded ? allGalleries : allGalleries.slice(0, 3);

    listEl.innerHTML = visible.map(g => {
      const created = new Date(g.created_at).toLocaleDateString();
      const link = `https://${window.location.host}/gallery.html?g=${g.slug}`;
      return `
        <div class="gallery-item">
          <div class="gallery-item-name">${g.client_business || g.client_name}</div>
          <div class="gallery-item-meta">${g.client_name} · ${g.media_count} item${g.media_count == 1 ? '' : 's'} · created ${created}</div>
          <div class="gallery-item-link">${link}</div>
          <button class="btn-small" onclick="toggleDuplicateForm('${g.id}')">[ Duplicate to New Client ]</button>
          <button class="btn-small" onclick="toggleDeliveryForm('${g.id}', '${g.slug}')">[ Send Direct Delivery ]</button>
          <button class="btn-small btn-danger" onclick="deleteGallery('${g.id}', ${JSON.stringify(g.client_business || g.client_name)})">[ Delete Gallery ]</button>
          <div class="duplicate-form" id="dupForm-${g.id}">
            <input type="text" placeholder="New client name" id="dupName-${g.id}">
            <input type="text" placeholder="New business name (optional)" id="dupBusiness-${g.id}">
            <input type="email" placeholder="New client email" id="dupEmail-${g.id}">
            <button class="btn-small" onclick="submitDuplicate('${g.id}')">[ Create Duplicate ]</button>
            <p class="status" id="dupStatus-${g.id}"></p>
          </div>
          <div class="duplicate-form" id="delivForm-${g.id}">
            <p class="tag" style="margin-bottom:10px;">Select files to send</p>
            <div class="thumbrow" id="delivThumbs-${g.id}"><span class="status">Loading files...</span></div>
            <input type="email" placeholder="Client email" id="delivEmail-${g.id}" style="margin-top:14px;">
            <label style="display:block; font-family:var(--mono); font-size:10.5px; letter-spacing:0.1em; text-transform:uppercase; color:var(--grey); margin:14px 0 8px;">Attach Your Invoice (Optional)</label>
            <input type="file" accept="application/pdf" id="delivInvoice-${g.id}">
            <button class="btn-small" onclick="submitDirectDelivery('${g.id}')" style="margin-top:14px;">[ Send Delivery Email ]</button>
            <p class="status" id="delivStatus-${g.id}"></p>
          </div>
          <p class="status" id="delStatus-${g.id}"></p>
        </div>`;
    }).join('');

    showMoreBtn.style.display = (!galleriesExpanded && allGalleries.length > 3) ? 'inline-block' : 'none';
  }

  function showMoreGalleries() {
    galleriesExpanded = true;
    renderGalleriesList();
  }

  async function deleteGallery(galleryId, displayName) {
    const statusEl = document.getElementById(`delStatus-${galleryId}`);

    const confirmed = confirm(
      `Permanently delete "${displayName}"?\n\nThis removes the gallery and every photo/video in it from storage. This can't be undone.`
    );
    if (!confirmed) return;

    statusEl.textContent = 'Deleting...';

    const res = await fetch('/api/admin-delete-gallery', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-admin-password': adminPassword },
      body: JSON.stringify({ galleryId }),
    });

    if (res.status === 401) {
      statusEl.textContent = 'Wrong admin password.';
      return;
    }
    if (res.status === 409) {
      const data = await res.json();
      statusEl.textContent = data.error;
      return;
    }
    if (!res.ok) {
      statusEl.textContent = 'Something went wrong — please try again.';
      return;
    }

    loadGalleries();
  }

  const deliveryMediaByGallery = {};   // galleryId -> media array, fetched once per panel open
  const deliverySelected = {};         // galleryId -> Set of selected media ids

  async function toggleDeliveryForm(galleryId, gallerySlug) {
    const panel = document.getElementById(`delivForm-${galleryId}`);
    const wasActive = panel.classList.contains('active');
    panel.classList.toggle('active');
    if (wasActive || deliveryMediaByGallery[galleryId]) return; // already loaded, or just closing

    const thumbsEl = document.getElementById(`delivThumbs-${galleryId}`);
    const res = await fetch(`/api/gallery?slug=${gallerySlug}`);
    const data = await res.json();
    deliveryMediaByGallery[galleryId] = data.media;
    deliverySelected[galleryId] = new Set();

    if (data.media.length === 0) {
      thumbsEl.innerHTML = '<span class="status">No files uploaded to this gallery yet.</span>';
      return;
    }

    thumbsEl.innerHTML = data.media.map(m => `
      <div class="deliv-thumb" id="delivThumb-${galleryId}-${m.id}" onclick="toggleDeliverySelect('${galleryId}', '${m.id}')">
        <img src="/api/media-proxy?url=${encodeURIComponent(m.thumb_url)}" alt="${m.filename}">
        <div class="check">✓</div>
      </div>
    `).join('');
  }

  function toggleDeliverySelect(galleryId, mediaId) {
    const set = deliverySelected[galleryId];
    const el = document.getElementById(`delivThumb-${galleryId}-${mediaId}`);
    if (set.has(mediaId)) { set.delete(mediaId); el.classList.remove('selected'); }
    else { set.add(mediaId); el.classList.add('selected'); }
  }

  function readFileAsBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(',')[1]); // strip the data: URL prefix
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function submitDirectDelivery(galleryId) {
    const statusEl = document.getElementById(`delivStatus-${galleryId}`);
    const mediaIds = [...(deliverySelected[galleryId] || [])];
    const clientEmail = document.getElementById(`delivEmail-${galleryId}`).value;
    const invoiceFile = document.getElementById(`delivInvoice-${galleryId}`).files[0];

    if (mediaIds.length === 0) { statusEl.textContent = 'Select at least one file to send.'; return; }
    if (!clientEmail) { statusEl.textContent = 'Client email is required.'; return; }

    statusEl.textContent = 'Sending...';

    let invoicePdfBase64 = null;
    let invoicePdfFilename = null;
    if (invoiceFile) {
      invoicePdfBase64 = await readFileAsBase64(invoiceFile);
      invoicePdfFilename = invoiceFile.name;
    }

    const res = await fetch('/api/admin-send-direct-delivery', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-admin-password': adminPassword },
      body: JSON.stringify({ galleryId, mediaIds, clientEmail, invoicePdfBase64, invoicePdfFilename }),
    });

    if (res.status === 401) { statusEl.textContent = 'Wrong admin password.'; return; }
    if (!res.ok) { statusEl.textContent = 'Something went wrong — please try again.'; return; }

    statusEl.textContent = `Sent to ${clientEmail}.`;
  }

  function toggleDuplicateForm(galleryId) {
    document.getElementById(`dupForm-${galleryId}`).classList.toggle('active');
  }

  async function submitDuplicate(sourceGalleryId) {
    const statusEl = document.getElementById(`dupStatus-${sourceGalleryId}`);
    const clientName = document.getElementById(`dupName-${sourceGalleryId}`).value;
    const clientBusiness = document.getElementById(`dupBusiness-${sourceGalleryId}`).value;
    const clientEmail = document.getElementById(`dupEmail-${sourceGalleryId}`).value;

    if (!clientName || !clientEmail) {
      statusEl.textContent = 'New client name and email are required.';
      return;
    }

    statusEl.textContent = 'Duplicating...';

    const res = await fetch('/api/admin-duplicate-gallery', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-admin-password': adminPassword },
      body: JSON.stringify({ sourceGalleryId, clientName, clientBusiness, clientEmail }),
    });

    if (res.status === 401) {
      statusEl.textContent = 'Wrong admin password.';
      return;
    }
    if (!res.ok) {
      const err = await res.json();
      statusEl.textContent = err.error || 'Something went wrong.';
      return;
    }

    const data = await res.json();
    statusEl.innerHTML = `Done — ${data.mediaCopied} item(s) copied.<br>${data.galleryUrl}`;
    loadGalleries();
  }

  // ---------- Orders list ----------

  let allOrders = [];
  let ordersExpanded = false;

  const PRODUCT_LABELS = {
    photo_single: 'Digital photo',
    photo_full_set: 'Full digital photo set',
    video_single: 'Digital video',
    video_full_set: 'Full digital video set',
    print_20x30: '20×30 framed print',
    print_24x36: '24×36 framed print',
    print_30x40: '30×40 framed print',
  };

  async function loadOrders() {
    const statusEl = document.getElementById('ordersStatus');

    const res = await fetch('/api/admin-list-orders', {
      headers: { 'x-admin-password': adminPassword },
    });

    if (res.status === 401) {
      statusEl.textContent = 'Wrong admin password.';
      return;
    }

    const data = await res.json();
    allOrders = data.orders;
    ordersExpanded = false;
    renderOrdersList();
  }

  function renderOrdersList() {
    const statusEl = document.getElementById('ordersStatus');
    const listEl = document.getElementById('ordersList');
    const showMoreBtn = document.getElementById('showMoreOrdersBtn');

    if (allOrders.length === 0) {
      statusEl.textContent = 'No orders yet.';
      listEl.innerHTML = '';
      showMoreBtn.style.display = 'none';
      return;
    }

    statusEl.textContent = '';
    const visible = ordersExpanded ? allOrders : allOrders.slice(0, 5);

    listEl.innerHTML = visible.map(o => {
      const created = new Date(o.created_at).toLocaleDateString();
      const cart = (o.product_details && o.product_details.cart) || [];
      const hasPrintItems = cart.some(item => item.key.startsWith('print_'));

      const linesHtml = cart.map(item => {
        const label = PRODUCT_LABELS[item.key] || item.key;
        const isPer = item.key.endsWith('_single') || item.key.startsWith('print_');
        const qty = isPer ? item.mediaIds.length : 1;
        return `${label}${qty > 1 || item.key.startsWith('print_') ? ` (×${qty})` : ''}`;
      }).join(' · ');

      const addr = o.shipping_address;
      const shipHtml = addr
        ? `<div class="order-item-ship">Ship to: ${addr.name}, ${addr.line1}, ${addr.city}, ${addr.state} ${addr.postal_code}, ${addr.country}</div>`
        : '';

      const fulfillHtml = hasPrintItems
        ? (o.fulfilled_at
            ? `<div class="fulfilled-badge">✓ Fulfilled ${new Date(o.fulfilled_at).toLocaleDateString()}</div>`
            : `<button class="btn-small" onclick="markFulfilled('${o.id}')">[ Mark as Fulfilled ]</button>`)
        : '';

      return `
        <div class="order-item">
          <div class="order-item-name">${o.client_business || o.client_name || 'Unknown client'}</div>
          <div class="order-item-meta">${o.customer_email} · $${(o.amount_total / 100).toFixed(2)} · ${o.fulfillment_type} · ${created}</div>
          <div class="order-item-lines">${linesHtml}</div>
          ${shipHtml}
          ${o.invoice_url ? `<div style="margin-top:10px;"><a href="${o.invoice_url}" style="color:var(--grey); font-family:var(--mono); font-size:11px;" target="_blank">[ View Invoice ]</a></div>` : ''}
          ${fulfillHtml}
          <p class="status" id="fulfillStatus-${o.id}"></p>
        </div>`;
    }).join('');

    showMoreBtn.style.display = (!ordersExpanded && allOrders.length > 5) ? 'inline-block' : 'none';
  }

  function showMoreOrders() {
    ordersExpanded = true;
    renderOrdersList();
  }

  async function markFulfilled(orderId) {
    const statusEl = document.getElementById(`fulfillStatus-${orderId}`);
    statusEl.textContent = 'Updating...';

    const res = await fetch('/api/admin-mark-fulfilled', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-admin-password': adminPassword },
      body: JSON.stringify({ orderId }),
    });

    if (res.status === 401) {
      statusEl.textContent = 'Wrong admin password.';
      return;
    }
    if (!res.ok) {
      statusEl.textContent = 'Something went wrong.';
      return;
    }

    loadOrders();
  }

  // ---------- Upload ----------

  async function uploadPhotos() {
    const { upload } = await import('https://esm.sh/@vercel/blob@latest/client');
    const statusEl = document.getElementById('uploadStatus');
    const files = document.getElementById('photoFiles').files;
    if (!currentGalleryId) { statusEl.textContent = 'Create a gallery first.'; return; }
    if (files.length === 0) { statusEl.textContent = 'Choose files first.'; return; }

    const progressWrap = document.getElementById('uploadProgress');
    const progressFill = document.getElementById('uploadProgressFill');
    const progressLabel = document.getElementById('uploadProgressLabel');
    const progressEta = document.getElementById('uploadProgressEta');

    const THUMB_ESTIMATE_BYTES = 150 * 1024;
    const totalBytes = Array.from(files).reduce((sum, f) => sum + f.size, 0) + files.length * THUMB_ESTIMATE_BYTES;
    let uploadedBytes = 0;
    const startTime = Date.now();

    progressWrap.style.display = 'block';
    progressFill.classList.add('indeterminate');
    progressFill.style.width = '';
    progressLabel.textContent = 'Starting...';
    progressEta.textContent = 'Estimating time remaining...';

    function renderProgress() {
      const pct = Math.min(100, Math.round((uploadedBytes / totalBytes) * 100));
      progressFill.classList.remove('indeterminate');
      progressFill.style.width = pct + '%';
      progressLabel.textContent = pct + '%';

      const elapsedSec = (Date.now() - startTime) / 1000;
      if (elapsedSec < 1 || uploadedBytes === 0) {
        progressEta.textContent = 'Estimating time remaining...';
        return;
      }
      const bytesPerSec = uploadedBytes / elapsedSec;
      const remainingSec = Math.max(0, (totalBytes - uploadedBytes) / bytesPerSec);
      progressEta.textContent = remainingSec < 3 ? 'Almost done...' : `~${formatDuration(remainingSec)} remaining`;
    }

    let fileIndex = 0;

    for (const file of files) {
      fileIndex++;
      const isVideo = file.type.startsWith('video/');
      statusEl.textContent = `Uploading ${file.name} (${isVideo ? 'video' : 'photo'}) — file ${fileIndex} of ${files.length}...`;

      const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
      const bytesBeforeThisFile = uploadedBytes;

      const fullResult = await upload(`galleries/${currentGalleryId}/full-${safeName}`, file, {
        access: 'private',
        handleUploadUrl: '/api/blob-upload-token',
        clientPayload: JSON.stringify({ adminPassword }),
        onUploadProgress: (event) => {
          uploadedBytes = bytesBeforeThisFile + (event.loaded || 0);
          renderProgress();
        },
      });
      uploadedBytes = bytesBeforeThisFile + file.size;
      renderProgress();

      const thumbBlob = isVideo ? await makeVideoPoster(file) : await makeThumbnail(file);
      const thumbResult = await upload(`galleries/${currentGalleryId}/thumb-${safeName}.jpg`, thumbBlob, {
        access: 'private',
        handleUploadUrl: '/api/blob-upload-token',
        clientPayload: JSON.stringify({ adminPassword }),
      });
      uploadedBytes += THUMB_ESTIMATE_BYTES;
      renderProgress();

      const dimensions = await getMediaDimensions(file, isVideo);

      await fetch('/api/admin-register-media', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-admin-password': adminPassword },
        body: JSON.stringify({
          galleryId: currentGalleryId,
          type: isVideo ? 'video' : 'photo',
          blobUrl: fullResult.url,
          thumbUrl: thumbResult.url,
          filename: file.name,
          fileSizeBytes: file.size,
          widthPx: dimensions.width,
          heightPx: dimensions.height,
        }),
      });

      const preview = document.createElement('img');
      preview.src = URL.createObjectURL(thumbBlob);
      document.getElementById('thumbPreview').appendChild(preview);
    }

    progressFill.style.width = '100%';
    progressLabel.textContent = '100%';
    progressEta.textContent = 'Complete';
    statusEl.textContent = `Done — ${files.length} file(s) uploaded.`;
    setTimeout(() => { progressWrap.style.display = 'none'; }, 2000);

    loadGalleries();
  }

  function formatDuration(seconds) {
    if (seconds < 60) return `${Math.ceil(seconds)}s`;
    const mins = Math.floor(seconds / 60);
    const secs = Math.round(seconds % 60);
    return `${mins}m ${secs}s`;
  }

  function getMediaDimensions(file, isVideo) {
    return new Promise((resolve) => {
      if (isVideo) {
        const video = document.createElement('video');
        video.preload = 'metadata';
        video.muted = true;
        video.src = URL.createObjectURL(file);
        video.addEventListener('loadedmetadata', () => {
          const dims = { width: video.videoWidth, height: video.videoHeight };
          URL.revokeObjectURL(video.src);
          resolve(dims);
        });
        video.addEventListener('error', () => resolve({ width: null, height: null }));
      } else {
        const img = new Image();
        img.onload = () => {
          const dims = { width: img.naturalWidth, height: img.naturalHeight };
          URL.revokeObjectURL(img.src);
          resolve(dims);
        };
        img.onerror = () => resolve({ width: null, height: null });
        img.src = URL.createObjectURL(file);
      }
    });
  }

  function makeThumbnail(file) {
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        const maxW = 800;
        const scale = Math.min(1, maxW / img.width);
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        canvas.toBlob(resolve, 'image/jpeg', 0.82);
      };
      img.src = URL.createObjectURL(file);
    });
  }

  function makeVideoPoster(file) {
    return new Promise((resolve, reject) => {
      const video = document.createElement('video');
      video.preload = 'metadata';
      video.muted = true;
      video.src = URL.createObjectURL(file);
      video.addEventListener('loadedmetadata', () => {
        video.currentTime = Math.min(1, video.duration / 2);
      });
      video.addEventListener('seeked', () => {
        const canvas = document.createElement('canvas');
        const maxW = 800;
        const scale = Math.min(1, maxW / video.videoWidth);
        canvas.width = video.videoWidth * scale;
        canvas.height = video.videoHeight * scale;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        canvas.toBlob(resolve, 'image/jpeg', 0.82);
        URL.revokeObjectURL(video.src);
      });
      video.addEventListener('error', reject);
    });
  }
</script>
</body>
</html>
